# Build gate. Runs on work in `dev` and on every PR; never deploys.
#
# Node 22, not 18: Next 16 does not build on Node 18, and the previous version
# of this file pinned 18 — which is why CI could never have gone green even
# once it was triggering.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    # Quoted: an unquoted colon inside a YAML scalar made this whole file
    # unparseable, so GitHub silently ignored every workflow in it.
    name: "Frontend: lint & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Advisory, not a gate. The repo currently has 18 pre-existing errors from
      # the React Compiler rules that ship with React 19 / Next 16
      # (react-hooks/purity, set-state-in-effect, immutability, refs) plus some
      # no-explicit-any, all in components/3d. The code did not change; the
      # rules did. Lint still runs and prints everything, so the list stays
      # visible — it just does not block the build or the deploy. Remove this
      # line once those are fixed, so lint gates again.
      - name: Lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        # NEXT_PUBLIC_* values are inlined at build time. CI only needs the
        # build to succeed, so a placeholder is correct here — the real value
        # is set by deploy-native.sh on the server.
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build --if-present

  backend:
    name: "Backend: lint & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # No lint script in backend/ yet — eslint was never installed there, so
      # --if-present skips this. continue-on-error keeps it from becoming a
      # gate the moment one is added, matching the frontend.
      - name: Lint
        working-directory: backend
        continue-on-error: true
        run: npm run lint --if-present

      - name: Build
        working-directory: backend
        run: npm run build --if-present
